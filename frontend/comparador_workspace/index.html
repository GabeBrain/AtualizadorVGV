<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Painel VGV Interativo</title>
  <style>
    :root {
      --brain-primary: #5b7537;
      --brain-secondary: #587030;
      --brain-highlight: #f8d000;
      --bg: #f7f8fa;
      --surface: #ffffff;
      --text: #111827;
      --muted: #6b7280;
      --line: #e5e7eb;
      --soft: #eef2e4;
      --radius: 14px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      background: transparent;
      color: var(--text);
      font-family: "Segoe UI", Arial, sans-serif;
    }

    .workspace {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background:
        radial-gradient(circle at 12% 8%, rgba(248, 208, 0, 0.16), transparent 38%),
        radial-gradient(circle at 90% 90%, rgba(91, 117, 55, 0.18), transparent 34%),
        linear-gradient(150deg, #fcfdf8 0%, var(--bg) 54%, #eef3e8 100%);
      display: grid;
      grid-template-columns: 360px minmax(0, 1fr);
      gap: 12px;
      min-height: 760px;
      overflow: hidden;
      animation: reveal 260ms ease-out;
    }

    @keyframes reveal {
      from {
        opacity: 0;
        transform: translateY(4px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .filters-panel {
      border-right: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.86);
      backdrop-filter: blur(2px);
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-height: 100%;
    }

    .panel-title {
      font-size: 17px;
      font-weight: 700;
      letter-spacing: 0.01em;
      margin: 0;
    }

    .panel-subtitle {
      font-size: 12px;
      color: var(--muted);
      margin: 0;
      line-height: 1.4;
    }

    .summary {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 8px;
    }

    .metric {
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 9px;
      background: var(--surface);
    }

    .metric-label {
      font-size: 10px;
      text-transform: uppercase;
      color: var(--muted);
      letter-spacing: 0.08em;
      margin-bottom: 4px;
    }

    .metric-value {
      font-size: 19px;
      font-weight: 700;
      line-height: 1;
    }

    .search-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
    }

    .search-input {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 9px 11px;
      font-size: 13px;
      color: var(--text);
      background: var(--surface);
      outline: none;
    }

    .search-input:focus {
      border-color: var(--brain-primary);
      box-shadow: 0 0 0 2px rgba(91, 117, 55, 0.16);
    }

    .btn {
      border: 1px solid var(--brain-primary);
      border-radius: 10px;
      padding: 8px 11px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      background: var(--brain-primary);
      color: #ffffff;
      transition: all 120ms ease;
      white-space: nowrap;
    }

    .btn:hover {
      background: var(--brain-secondary);
      border-color: var(--brain-secondary);
    }

    .groups {
      display: grid;
      gap: 8px;
      overflow-y: auto;
      padding-right: 2px;
      min-height: 0;
    }

    .group {
      border: 1px solid var(--line);
      border-radius: 11px;
      background: var(--surface);
      padding: 8px;
      display: grid;
      gap: 7px;
    }

    .group-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 8px;
    }

    .group-title {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .group-count {
      font-size: 12px;
      color: var(--brain-primary);
      font-weight: 700;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      max-height: 190px;
      overflow-y: auto;
      padding-right: 2px;
    }

    .chip {
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #ffffff;
      color: var(--text);
      font-size: 12px;
      padding: 4px 9px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      max-width: 100%;
    }

    .chip:hover {
      border-color: var(--brain-primary);
      transform: translateY(-1px);
    }

    .chip.active {
      background: var(--soft);
      border-color: #a8b998;
      color: #1f3a10;
      font-weight: 700;
    }

    .chip-count {
      font-size: 10px;
      color: var(--muted);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0 5px;
      background: #ffffff;
    }

    .chip.active .chip-count {
      border-color: #c7d6b9;
      color: #284417;
      background: #f7fbf1;
    }

    .map-panel {
      padding: 12px;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      gap: 8px;
      min-height: 100%;
    }

    .map-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .map-title {
      margin: 0;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.01em;
    }

    .map-badges {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .badge {
      border: 1px solid #c6d2b8;
      background: #f5f8ef;
      color: #334c1d;
      border-radius: 999px;
      padding: 3px 10px;
      font-size: 11px;
      font-weight: 700;
    }

    .map-shell {
      border: 1px solid var(--line);
      border-radius: 12px;
      overflow: hidden;
      background: linear-gradient(180deg, #f3f8ec 0%, #eaf2e2 100%);
      position: relative;
      min-height: 560px;
    }

    #geo-svg {
      width: 100%;
      height: 100%;
      min-height: 560px;
      display: block;
      background: linear-gradient(180deg, #f6fbf2 0%, #eef4ea 100%);
    }

    .map-empty {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 16px;
      font-size: 13px;
      color: var(--muted);
      background: linear-gradient(135deg, #f8faef 0%, #ffffff 100%);
      z-index: 40;
    }

    .map-empty.visible {
      display: flex;
    }

    .footer {
      font-size: 12px;
      color: var(--muted);
      border-top: 1px dashed var(--line);
      padding-top: 7px;
    }

    @media (max-width: 980px) {
      .workspace {
        grid-template-columns: 1fr;
      }

      .filters-panel {
        border-right: none;
        border-bottom: 1px solid var(--line);
      }

      .map-shell,
      #geo-svg {
        min-height: 420px;
      }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script>
    const NS = "http://www.w3.org/2000/svg";

    const FIELD_CONFIG = [
      { field: "empreendimentos", rowKey: "empreendimento", label: "Empreendimento" },
      { field: "cidades", rowKey: "cidade", label: "Cidade" },
      { field: "tipologias", rowKey: "tipologia", label: "Tipologia" },
      { field: "status", rowKey: "status", label: "Status atual" }
    ];

    const Bridge = {
      MESSAGE_RENDER: "streamlit:render",
      MESSAGE_COMPONENT_READY: "streamlit:componentReady",
      MESSAGE_SET_FRAME_HEIGHT: "streamlit:setFrameHeight",
      MESSAGE_SET_COMPONENT_VALUE: "streamlit:setComponentValue",
      send(type, payload) {
        window.parent.postMessage({ isStreamlitMessage: true, type, ...payload }, "*");
      },
      setComponentReady() {
        this.send(this.MESSAGE_COMPONENT_READY, { apiVersion: 1 });
      },
      setFrameHeight(height) {
        const resolved = height || document.documentElement.scrollHeight;
        this.send(this.MESSAGE_SET_FRAME_HEIGHT, { height: resolved });
      },
      setComponentValue(value) {
        this.send(this.MESSAGE_SET_COMPONENT_VALUE, { value });
      }
    };

    const root = document.getElementById("root");
    const state = {
      payload: {},
      filters: {
        empreendimentos: [],
        cidades: [],
        tipologias: [],
        status: []
      },
      query: "",
      resizeBound: false,
      resizeTimer: null
    };

    function safeText(value) {
      if (value === null || value === undefined) return "";
      return String(value).trim();
    }

    function parseNum(value) {
      const n = Number(value);
      return Number.isFinite(n) ? n : null;
    }

    function asArray(value) {
      return Array.isArray(value) ? value : [];
    }

    function uniqueStrings(values) {
      return [...new Set(asArray(values).map((v) => safeText(v)).filter(Boolean))];
    }

    function formatInt(value) {
      const n = Number(value);
      if (!Number.isFinite(n)) return "-";
      return n.toLocaleString("pt-BR", { maximumFractionDigits: 0 });
    }

    function escapeHtml(value) {
      return safeText(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function svgEl(name, attrs = {}) {
      const el = document.createElementNS(NS, name);
      Object.entries(attrs).forEach(([key, value]) => {
        if (value !== null && value !== undefined) {
          el.setAttribute(key, String(value));
        }
      });
      return el;
    }

    function normalizeFilters(rawFilters, options) {
      const result = {};
      for (const cfg of FIELD_CONFIG) {
        const allowed = new Set(uniqueStrings(options[cfg.field]));
        const incoming = uniqueStrings(rawFilters[cfg.field]);
        result[cfg.field] = incoming.filter((item) => allowed.has(item));
      }
      return result;
    }

    function matchesRow(row, filters, query, excludeField) {
      for (const cfg of FIELD_CONFIG) {
        if (excludeField && cfg.field === excludeField) continue;
        const selected = asArray(filters[cfg.field]);
        if (selected.length > 0 && !selected.includes(safeText(row[cfg.rowKey]))) {
          return false;
        }
      }

      if (query) {
        const haystack = [row.empreendimento, row.cidade, row.tipologia, row.status]
          .map((v) => safeText(v).toLowerCase())
          .join(" ");
        if (!haystack.includes(query.toLowerCase())) return false;
      }

      return true;
    }

    function getFilteredRows() {
      const rows = asArray(state.payload.rows);
      return rows.filter((row) => matchesRow(row, state.filters, state.query, null));
    }

    function countByFieldOption(fieldCfg, optionValue) {
      const rows = asArray(state.payload.rows);
      let count = 0;
      for (const row of rows) {
        if (!matchesRow(row, state.filters, state.query, fieldCfg.field)) continue;
        if (safeText(row[fieldCfg.rowKey]) === optionValue) count += 1;
      }
      return count;
    }

    function computeBounds(points) {
      let minLat = Infinity;
      let maxLat = -Infinity;
      let minLon = Infinity;
      let maxLon = -Infinity;

      points.forEach((point) => {
        const lat = parseNum(point.lat);
        const lon = parseNum(point.lon);
        if (lat === null || lon === null) return;
        if (lat < minLat) minLat = lat;
        if (lat > maxLat) maxLat = lat;
        if (lon < minLon) minLon = lon;
        if (lon > maxLon) maxLon = lon;
      });

      if (!Number.isFinite(minLat) || !Number.isFinite(maxLat) || !Number.isFinite(minLon) || !Number.isFinite(maxLon)) {
        return null;
      }

      if (minLat === maxLat) {
        minLat -= 0.25;
        maxLat += 0.25;
      }

      if (minLon === maxLon) {
        minLon -= 0.25;
        maxLon += 0.25;
      }

      const latPad = Math.max((maxLat - minLat) * 0.08, 0.05);
      const lonPad = Math.max((maxLon - minLon) * 0.08, 0.05);

      return {
        minLat: minLat - latPad,
        maxLat: maxLat + latPad,
        minLon: minLon - lonPad,
        maxLon: maxLon + lonPad
      };
    }

    function projectPoint(lat, lon, bounds, width, height, pad) {
      const x = pad + ((lon - bounds.minLon) / (bounds.maxLon - bounds.minLon)) * (width - pad * 2);
      const y = height - pad - ((lat - bounds.minLat) / (bounds.maxLat - bounds.minLat)) * (height - pad * 2);
      return { x, y };
    }

    function emitFilters(reason) {
      Bridge.setComponentValue({
        action: "set_filters",
        reason: reason || "ui_change",
        filters: state.filters
      });
    }

    function toggleFilter(field, value) {
      const current = new Set(asArray(state.filters[field]));
      if (current.has(value)) {
        current.delete(value);
      } else {
        current.add(value);
      }
      state.filters[field] = [...current];
      emitFilters("toggle_chip");
      renderAll();
    }

    function clearAllFilters() {
      for (const cfg of FIELD_CONFIG) {
        state.filters[cfg.field] = [];
      }
      state.query = "";
      emitFilters("clear_all");
      renderAll();
    }

    function renderFilterGroups() {
      const host = document.getElementById("groups");
      if (!host) return;

      const options = state.payload.options || {};
      const htmlParts = [];

      for (const cfg of FIELD_CONFIG) {
        const optionList = uniqueStrings(options[cfg.field]).slice(0, 220);
        const selectedSet = new Set(asArray(state.filters[cfg.field]));

        const chips = optionList
          .map((value) => {
            const count = countByFieldOption(cfg, value);
            const activeClass = selectedSet.has(value) ? "chip active" : "chip";
            return (
              `<button class="${activeClass}" data-field="${cfg.field}" data-value="${escapeHtml(value)}" title="${escapeHtml(value)}">` +
              `${escapeHtml(value)} <span class="chip-count">${formatInt(count)}</span>` +
              `</button>`
            );
          })
          .join("");

        htmlParts.push(
          `<section class="group">` +
          `<div class="group-header"><div class="group-title">${cfg.label}</div><div class="group-count">${formatInt(selectedSet.size)}</div></div>` +
          `<div class="chips">${chips || "<span class='panel-subtitle'>Sem opcoes</span>"}</div>` +
          `</section>`
        );
      }

      host.innerHTML = htmlParts.join("");

      host.querySelectorAll("[data-field][data-value]").forEach((el) => {
        el.addEventListener("click", () => {
          const field = el.getAttribute("data-field");
          const value = el.getAttribute("data-value");
          if (!field || !value) return;
          toggleFilter(field, value);
        });
      });
    }

    function renderSummary(filteredRows) {
      const filteredEmpEl = document.getElementById("metric-filtered-emp");
      const badgeRows = document.getElementById("badge-rows");
      const badgePoints = document.getElementById("badge-points");

      const filteredEmp = new Set(
        filteredRows.map((row) => safeText(row.empreendimento)).filter(Boolean)
      ).size;
      const mapPoints = filteredRows.filter((row) => parseNum(row.lat) !== null && parseNum(row.lon) !== null).length;

      if (filteredEmpEl) filteredEmpEl.textContent = formatInt(filteredEmp);
      if (badgeRows) badgeRows.textContent = `${formatInt(filteredRows.length)} linhas`;
      if (badgePoints) badgePoints.textContent = `${formatInt(mapPoints)} pontos`;
    }

    function renderGeoPlot(filteredRows) {
      const svg = document.getElementById("geo-svg");
      const emptyEl = document.getElementById("map-empty");
      if (!svg) return;

      const points = filteredRows
        .map((row) => ({ ...row, lat: parseNum(row.lat), lon: parseNum(row.lon) }))
        .filter((row) => row.lat !== null && row.lon !== null);

      svg.innerHTML = "";

      if (points.length === 0) {
        if (emptyEl) {
          emptyEl.classList.add("visible");
          emptyEl.textContent = "Sem coordenadas validas para os filtros atuais.";
        }
        return;
      }

      if (emptyEl) emptyEl.classList.remove("visible");

      const rect = svg.getBoundingClientRect();
      const width = Math.max(640, rect.width || 640);
      const height = Math.max(520, rect.height || 520);
      const pad = 36;
      const bounds = computeBounds(points);

      if (!bounds) {
        if (emptyEl) {
          emptyEl.classList.add("visible");
          emptyEl.textContent = "Nao foi possivel projetar os pontos geograficos.";
        }
        return;
      }

      svg.setAttribute("viewBox", `0 0 ${width} ${height}`);

      const bg = svgEl("rect", {
        x: 0,
        y: 0,
        width,
        height,
        fill: "url(#bgfade)"
      });

      const defs = svgEl("defs");
      const gradient = svgEl("linearGradient", { id: "bgfade", x1: "0", y1: "0", x2: "0", y2: "1" });
      gradient.appendChild(svgEl("stop", { offset: "0%", "stop-color": "#f7faef" }));
      gradient.appendChild(svgEl("stop", { offset: "100%", "stop-color": "#eef3e8" }));
      defs.appendChild(gradient);
      svg.appendChild(defs);
      svg.appendChild(bg);

      const gridGroup = svgEl("g", { opacity: "0.45" });
      const steps = 6;

      for (let i = 0; i <= steps; i += 1) {
        const x = pad + ((width - pad * 2) / steps) * i;
        const y = pad + ((height - pad * 2) / steps) * i;

        gridGroup.appendChild(
          svgEl("line", {
            x1: x,
            y1: pad,
            x2: x,
            y2: height - pad,
            stroke: "#d6e0cf",
            "stroke-width": 1
          })
        );

        gridGroup.appendChild(
          svgEl("line", {
            x1: pad,
            y1: y,
            x2: width - pad,
            y2: y,
            stroke: "#d6e0cf",
            "stroke-width": 1
          })
        );
      }

      svg.appendChild(gridGroup);

      svg.appendChild(
        svgEl("rect", {
          x: pad,
          y: pad,
          width: width - pad * 2,
          height: height - pad * 2,
          fill: "none",
          stroke: "#b7c6aa",
          "stroke-width": 1.2,
          rx: 8
        })
      );

      // Silhueta aproximada do Brasil para dar contexto visual ao geoplote.
      const brazilOutline = [
        [-73.9, -33.8],
        [-70.8, -12.4],
        [-62.2, 4.4],
        [-50.5, 4.9],
        [-34.9, -7.8],
        [-38.8, -13.8],
        [-43.8, -22.4],
        [-49.4, -29.7],
        [-55.1, -31.2],
        [-58.6, -27.8],
        [-62.6, -20.5],
        [-66.8, -9.9],
        [-73.9, -33.8]
      ];

      const projectedOutline = brazilOutline
        .map(([lon, lat]) => projectPoint(lat, lon, bounds, width, height, pad))
        .map((p, idx) => `${idx === 0 ? "M" : "L"} ${p.x.toFixed(2)} ${p.y.toFixed(2)}`)
        .join(" ");

      if (projectedOutline) {
        svg.appendChild(
          svgEl("path", {
            d: `${projectedOutline} Z`,
            fill: "#dfe9d2",
            stroke: "#a9bc97",
            "stroke-width": 1.4,
            opacity: 0.58
          })
        );
      }

      const selectedEmp = new Set(asArray(state.filters.empreendimentos));
      const pointGroup = svgEl("g");

      points.forEach((row) => {
        const pos = projectPoint(row.lat, row.lon, bounds, width, height, pad);
        const isSelected = selectedEmp.size > 0 && selectedEmp.has(safeText(row.empreendimento));

        const circle = svgEl("circle", {
          cx: pos.x,
          cy: pos.y,
          r: isSelected ? 7.2 : 5.5,
          fill: isSelected ? "#f8d000" : "#587030",
          stroke: isSelected ? "#5b7537" : "#ffffff",
          "stroke-width": isSelected ? 2 : 1.3,
          opacity: isSelected ? 0.95 : 0.86,
          cursor: "pointer"
        });

        circle.appendChild(
          svgEl("title", {
            })
        );
        circle.firstChild.textContent =
          `${safeText(row.empreendimento) || "-"}\n` +
          `Cidade: ${safeText(row.cidade) || "-"}\n` +
          `Tipologia: ${safeText(row.tipologia) || "-"}\n` +
          `Status: ${safeText(row.status) || "-"}`;

        circle.addEventListener("click", () => {
          const emp = safeText(row.empreendimento);
          if (!emp) return;
          state.filters.empreendimentos = [emp];
          emitFilters("marker_click");
          renderAll();
        });

        pointGroup.appendChild(circle);
      });

      svg.appendChild(pointGroup);

      const legend = svgEl("g");
      legend.appendChild(
        svgEl("rect", {
          x: pad + 8,
          y: pad + 8,
          width: 182,
          height: 44,
          rx: 8,
          fill: "#ffffffd9",
          stroke: "#d4ddcc"
        })
      );
      legend.appendChild(svgEl("circle", { cx: pad + 24, cy: pad + 24, r: 5.3, fill: "#587030", stroke: "#fff", "stroke-width": 1.2 }));
      legend.appendChild(svgEl("text", { x: pad + 36, y: pad + 28, fill: "#31481d", "font-size": 11, "font-weight": 600 }));
      legend.lastChild.textContent = "Ponto filtrado";
      legend.appendChild(svgEl("circle", { cx: pad + 24, cy: pad + 42, r: 6.5, fill: "#f8d000", stroke: "#5b7537", "stroke-width": 1.6 }));
      legend.appendChild(svgEl("text", { x: pad + 36, y: pad + 46, fill: "#31481d", "font-size": 11, "font-weight": 600 }));
      legend.lastChild.textContent = "Empreendimento em foco";
      svg.appendChild(legend);
    }

    function renderAll() {
      renderFilterGroups();
      const filteredRows = getFilteredRows();
      renderSummary(filteredRows);
      renderGeoPlot(filteredRows);
      window.setTimeout(() => Bridge.setFrameHeight(), 0);
    }

    function ensureResizeBinding() {
      if (state.resizeBound) return;
      state.resizeBound = true;

      window.addEventListener("resize", () => {
        if (state.resizeTimer) {
          window.clearTimeout(state.resizeTimer);
        }
        state.resizeTimer = window.setTimeout(() => {
          renderAll();
        }, 120);
      });
    }

    function renderWorkspace(payload) {
      state.payload = payload || {};
      state.filters = normalizeFilters(payload.selectedFilters || {}, payload.options || {});

      root.innerHTML = `
        <div class="workspace">
          <aside class="filters-panel">
            <h3 class="panel-title">Painel VGV Interativo</h3>
            <p class="panel-subtitle">Painel de filtros interativo com estado independente nesta pagina.</p>
            <div class="summary">
              <div class="metric">
                <div class="metric-label">Empreendimentos filtrados</div>
                <div id="metric-filtered-emp" class="metric-value">-</div>
              </div>
            </div>
            <div class="search-row">
              <input id="filter-search" class="search-input" type="text" placeholder="Buscar empreendimento, cidade, tipologia..." />
              <button id="clear-filters" class="btn" type="button">Limpar filtros</button>
            </div>
            <div id="groups" class="groups"></div>
          </aside>
          <section class="map-panel">
            <div class="map-header">
              <h3 class="map-title">Mapa reativo</h3>
              <div class="map-badges">
                <span id="badge-rows" class="badge">-</span>
                <span id="badge-points" class="badge">-</span>
              </div>
            </div>
            <div class="map-shell">
              <svg id="geo-svg" preserveAspectRatio="xMidYMid meet"></svg>
              <div id="map-empty" class="map-empty"></div>
            </div>
            <div class="footer">
              Clique em um ponto para focar o empreendimento. Visual geoespacial desenhado localmente no componente.
            </div>
          </section>
        </div>
      `;

      const searchInput = document.getElementById("filter-search");
      const clearBtn = document.getElementById("clear-filters");

      if (searchInput) {
        searchInput.value = state.query || "";
        searchInput.addEventListener("input", (event) => {
          state.query = safeText(event.target.value);
          renderAll();
        });
      }

      if (clearBtn) {
        clearBtn.addEventListener("click", () => {
          clearAllFilters();
        });
      }

      ensureResizeBinding();
      renderAll();
    }

    window.addEventListener("message", (event) => {
      const data = event.data;
      if (!data || data.type !== Bridge.MESSAGE_RENDER) return;
      const payload = (data.args && data.args.payload) || {};
      renderWorkspace(payload);
    });

    Bridge.setComponentReady();
    Bridge.setFrameHeight(860);
  </script>
</body>
</html>
