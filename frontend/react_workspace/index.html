<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>React Workspace POC</title>
  <style>
    :root {
      --bg: #f8f7f2;
      --panel: #ffffff;
      --ink: #10232c;
      --muted: #5f6f76;
      --line: #d9dfdc;
      --accent: #2e5f4f;
      --accent-soft: #e6efe9;
      --radius: 14px;
    }

    body {
      margin: 0;
      padding: 0;
      background: transparent;
      color: var(--ink);
      font-family: "Segoe UI", Arial, sans-serif;
    }

    .workspace {
      background: linear-gradient(145deg, #fafaf7 0%, #f2f6f3 60%, #eef4f1 100%);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 14px;
      display: grid;
      gap: 12px;
    }

    .header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
    }

    .title {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.01em;
    }

    .hint {
      font-size: 12px;
      color: var(--muted);
    }

    .metrics {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }

    .metric {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 11px;
      padding: 10px;
      min-height: 62px;
    }

    .metric-label {
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .metric-value {
      font-size: 20px;
      font-weight: 700;
      margin-top: 2px;
      line-height: 1;
    }

    .controls {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
    }

    select {
      border: 1px solid var(--line);
      border-radius: 9px;
      padding: 8px 10px;
      font-size: 13px;
      width: 100%;
      background: var(--panel);
      color: var(--ink);
    }

    button {
      border: 1px solid var(--accent);
      border-radius: 9px;
      background: var(--accent);
      color: #fff;
      padding: 8px 12px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .chip {
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 12px;
      background: #fff;
      color: var(--ink);
      cursor: pointer;
      max-width: 100%;
      white-space: nowrap;
      text-overflow: ellipsis;
      overflow: hidden;
    }

    .chip.active {
      background: var(--accent-soft);
      border-color: #9cb9aa;
      color: #133427;
      font-weight: 600;
    }

    .footer {
      font-size: 11px;
      color: var(--muted);
      border-top: 1px dashed var(--line);
      padding-top: 8px;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script>
    const root = document.getElementById("root");

    const Bridge = {
      MESSAGE_RENDER: "streamlit:render",
      MESSAGE_COMPONENT_READY: "streamlit:componentReady",
      MESSAGE_SET_FRAME_HEIGHT: "streamlit:setFrameHeight",
      MESSAGE_SET_COMPONENT_VALUE: "streamlit:setComponentValue",

      send(type, payload) {
        window.parent.postMessage(
          {
            isStreamlitMessage: true,
            type,
            ...payload,
          },
          "*"
        );
      },

      setComponentReady() {
        this.send(this.MESSAGE_COMPONENT_READY, { apiVersion: 1 });
      },

      setFrameHeight(height) {
        const resolvedHeight = height || document.documentElement.scrollHeight;
        this.send(this.MESSAGE_SET_FRAME_HEIGHT, { height: resolvedHeight });
      },

      setComponentValue(value) {
        this.send(this.MESSAGE_SET_COMPONENT_VALUE, { value });
      },
    };

    function formatInt(value) {
      const num = Number(value);
      if (!Number.isFinite(num)) return "-";
      return num.toLocaleString("pt-BR", { maximumFractionDigits: 0 });
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function renderWorkspace(payload) {
      const summary = payload.summary || {};
      const options = Array.isArray(payload.empreendimentos) ? payload.empreendimentos : [];
      const selected = payload.selectedEmpreendimento || "";

      const optionsHtml = ['<option value="">All empreendimentos</option>']
        .concat(
          options.map((name) => {
            const safe = escapeHtml(name);
            const isSelected = selected === name ? " selected" : "";
            return `<option value="${safe}"${isSelected}>${safe}</option>`;
          })
        )
        .join("");

      const chipHtml = options
        .slice(0, 10)
        .map((name) => {
          const safe = escapeHtml(name);
          const className = selected === name ? "chip active" : "chip";
          return `<button class="${className}" data-chip="${safe}" title="${safe}">${safe}</button>`;
        })
        .join("");

      root.innerHTML = `
        <div class="workspace">
          <div class="header">
            <div class="title">React Workspace (POC)</div>
            <div class="hint">Bridge local sem dependencia de CDN</div>
          </div>
          <div class="metrics">
            <div class="metric">
              <div class="metric-label">Rows</div>
              <div class="metric-value">${formatInt(summary.rows || 0)}</div>
            </div>
            <div class="metric">
              <div class="metric-label">Months</div>
              <div class="metric-value">${formatInt(summary.months || 0)}</div>
            </div>
            <div class="metric">
              <div class="metric-label">Empreend.</div>
              <div class="metric-value">${formatInt(summary.empreendimentos || 0)}</div>
            </div>
          </div>
          <div class="controls">
            <select id="focus-select">${optionsHtml}</select>
            <button id="apply-focus">Apply</button>
          </div>
          <div class="chips">${chipHtml}</div>
          <div class="footer">POC streamlit component with local assets.</div>
        </div>
      `;

      const selectEl = document.getElementById("focus-select");
      const applyBtn = document.getElementById("apply-focus");

      function submit(value) {
        Bridge.setComponentValue({
          action: "set_focus",
          selectedEmpreendimento: value || "",
        });
      }

      if (applyBtn && selectEl) {
        applyBtn.addEventListener("click", () => submit(selectEl.value));
      }

      root.querySelectorAll("[data-chip]").forEach((chipEl) => {
        chipEl.addEventListener("click", () => {
          const value = chipEl.getAttribute("data-chip") || "";
          if (selectEl) {
            selectEl.value = value;
          }
          submit(value);
        });
      });

      window.setTimeout(() => Bridge.setFrameHeight(), 0);
    }

    window.addEventListener("message", (event) => {
      const data = event.data;
      if (!data || data.type !== Bridge.MESSAGE_RENDER) {
        return;
      }

      const payload = (data.args && data.args.payload) || {};
      renderWorkspace(payload);
    });

    Bridge.setComponentReady();
    Bridge.setFrameHeight(520);
  </script>
</body>
</html>
